name: tsega_app
description: Tsega ጸጋ - AI Health Intelligence for Every Ethiopian Woman
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── STATE MANAGEMENT ──────────────────────────────────────────
  provider: ^6.1.2

  # ── STORAGE ───────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── NAVIGATION ────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── UI ────────────────────────────────────────────────────────
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # ── UTILITIES ─────────────────────────────────────────────────
  intl: ^0.19.0
  url_launcher: ^6.3.1

  # ── NEW: HEALTH / WEARABLES ───────────────────────────────────
  health: ^10.2.0

  # ── NEW: QR CODE ──────────────────────────────────────────────
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # ── NEW: ANIMATIONS ───────────────────────────────────────────
  lottie: ^3.1.2

  # ── NEW: IMAGE ────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # ── NEW: SUPABASE (backend) ───────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── NEW: HAPTICS ──────────────────────────────────────────────
  # Already in Flutter via HapticFeedback — no package needed

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    # Images
    - assets/images/backgrounds/
    - assets/images/illustrations/
    - assets/images/onboarding/
    - assets/images/misc/
  
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app/ic_launcher_512.png"
  min_sdk_android: 21
